name: Build
run-name: Build ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      definition:
        description: Definition
        required: true
        type: choice
        options:
          - 1-php8.2-alpine3.24
          - 1-php8.2-alpine3.24-dev
          - 1-php8.3-alpine3.24
          - 1-php8.3-alpine3.24-dev
          - 1-php8.4-alpine3.24
          - 1-php8.4-alpine3.24-dev
          - 1-php8.5-alpine3.24
          - 1-php8.5-alpine3.24-dev

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.tags.outputs.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Get tags from definition
        id: tags
        uses: mikefarah/yq@master
        with:
          cmd: yq '.tags[] | "\(.)"' "image/${{ inputs.definition }}.yaml"

  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    needs:
      - prepare
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      file: image/${{ inputs.definition }}.yaml
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: ${{ needs.prepare.outputs.tags }}
      output: image
      platforms: |
        linux/amd64
        linux/arm64
      push: true
      sbom: true
      sign: true
    secrets:
      registry-auths: |
        - registry: dhi.io
          username: ${{ secrets.DOCKER_ACTOR }}
          password: ${{ secrets.DOCKER_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
