name: Build

on:
  push:
    branches: [main]
  schedule:
    - cron: 0 0 * * *

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update definitions
        run: .github/scripts/update.sh

      - name: Commit & push changes
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: .github/scripts/commit-push.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - update
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        definition:
          - 1-php8.5-alpine3.23
          - 1-php8.5-alpine3.23-dev
          - 1-php8.5-debian13
          - 1-php8.5-debian13-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Get tags from definition
        id: tags
        uses: mikefarah/yq@master
        with:
          cmd: yq '.image as $image | .tags[] | "\($image):\(.)"' "./image/${{ matrix.definition }}.yaml"

      - name: Log in to DHI
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ACTOR }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: image/${{ matrix.definition }}.yaml
          platforms: linux/amd64,linux/arm64
          sbom: true
          push: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.result }}
