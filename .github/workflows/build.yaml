name: Build

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - update
    branches:
      - main
    types:
      - completed

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        definition:
          - 1-php8.2-alpine3.24
          - 1-php8.2-alpine3.24-dev
          - 1-php8.3-alpine3.24
          - 1-php8.3-alpine3.24-dev
          - 1-php8.4-alpine3.24
          - 1-php8.4-alpine3.24-dev
          - 1-php8.5-alpine3.24
          - 1-php8.5-alpine3.24-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Get tags from definition
        id: tags
        uses: mikefarah/yq@master
        with:
          cmd: yq '.image as $image | .tags[] | "\($image):\(.)"' "./image/${{ matrix.definition }}.yaml"

      - name: Log in to DHI
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_ACTOR }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: image/${{ matrix.definition }}.yaml
          platforms: linux/amd64,linux/arm64
          sbom: true
          push: true
          provenance: mode=max
          tags: ${{ steps.tags.outputs.result }}
