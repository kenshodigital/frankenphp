# syntax=dhi.io/build:2-alpine3.23

name: FrankenPHP
image: ghcr.io/kenshodigital/frankenphp
variant: runtime
tags:
  - 1-php8.4-alpine
  - 1-php8.4-alpine3.23
  - 1-php8.4.22-alpine
  - 1-php8.4.22-alpine3.23
  - 1.12-php8.4-alpine
  - 1.12-php8.4-alpine3.23
  - 1.12-php8.4.22-alpine
  - 1.12-php8.4.22-alpine3.23
  - 1.12.4-php8.4-alpine
  - 1.12.4-php8.4-alpine3.23
  - 1.12.4-php8.4.22-alpine
  - 1.12.4-php8.4.22-alpine3.23

platforms:
  - linux/amd64
  - linux/arm64

dates:
  release: 2026-06-05

vars:
  RELEASE_DATE: 2026-06-05
  FRANKENPHP_PACKAGE_VERSION: 1.12.4p84-r0
  PHP_PACKAGE_VERSION: 8.4.22-r0

contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
    - https://pkg.henderkes.com/api/packages/84/alpine/main/php-zts
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
    - https://github.com/kenshodigital/frankenphp/raw/refs/heads/main/key/alpine/84@e8d0b922f3fc6ca07c7c4aeac964ae300afe70bf48771bf57cbd92a2879f3940.rsa.pub
  packages:
    - alpine-baselayout-data
    - busybox
    - ca-certificates-bundle
    - frankenphp=1.12.4p84-r0
    - php-zts-embed=8.4.22-r0
    - tzdata

accounts:
  run-as: frankenphp
  users:
    - name: frankenphp
      uid: 65532
      gid: 65532
  groups:
    - name: frankenphp
      gid: 65532
      members:
        - frankenphp

os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/

work-dir: /srv

environment:
  SERVER_NAME: :8080
  SERVER_ROOT: /srv/public
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - type: file
    path: /etc/frankenphp/Caddyfile
    content: |
      {
      	skip_install_trust
      }
      {$SERVER_NAME} {
      	root {$SERVER_ROOT}
      	encode zstd br gzip
      	php_server
      }
  - type: directory
    path: /srv/public
  - type: symlink
    path: /srv/public/index.php
    source: /usr/share/frankenphp/index.php

annotations:
  org.opencontainers.image.description: A minimal FrankenPHP image
  org.opencontainers.image.licenses: MIT

entrypoint:
  - /usr/bin/frankenphp

cmd:
  - run
  - --config
  - /etc/frankenphp/Caddyfile

ports:
  - 8080/tcp
