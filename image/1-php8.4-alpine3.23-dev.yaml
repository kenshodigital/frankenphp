# syntax=dhi.io/build:2-alpine3.23

name: FrankenPHP
image: ghcr.io/kenshodigital/frankenphp
variant: dev
tags:
  - 1-php8.4-alpine3.23-dev
  - 1-php8.4.25-alpine3.23-dev
  - 1.12-php8.4-alpine3.23-dev
  - 1.12-php8.4.25-alpine3.23-dev
  - 1.12.7-php8.4-alpine3.23-dev
  - 1.12.7-php8.4.25-alpine3.23-dev

platforms:
  - linux/amd64
  - linux/arm64

dates:
  release: 2026-09-03

vars:
  RELEASE_DATE: 2026-09-03
  FRANKENPHP_PACKAGE_VERSION: 1.12.7p84-r0
  PHP_PACKAGE_VERSION: 8.4.25-r0

contents:
  repositories:
    - https://dhi.io/apk/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.23/community
    - https://pkg.henderkes.com/api/packages/84/alpine/main/php-zts
  keyring:
    - https://dhi.io/keyring/dhi-apk@docker-0F81AD7700D99184.rsa.pub
    - https://github.com/kenshodigital/frankenphp/raw/refs/heads/main/key/alpine/84@e8d0b922f3fc6ca07c7c4aeac964ae300afe70bf48771bf57cbd92a2879f3940.rsa.pub
  packages:
    - alpine-baselayout-data
    - apk-tools
    - busybox
    - ca-certificates-bundle
    - frankenphp
    - libgcc
    - php-zts-cli
    - php-zts-devel
    - php-zts-embed
    - php-zts-xdebug
    - pie-zts
    - tzdata
  files:
    - url: https://getcomposer.org/download/latest-stable/composer.phar
      checksum: sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6
      path: /usr/local/bin/composer
      mode: "0755"

accounts:
  root: true
  run-as: root
  users:
    - name: frankenphp
      uid: 65532
      gid: 65532
  groups:
    - name: frankenphp
      gid: 65532
      members:
        - frankenphp

os-release:
  name: Docker Hardened Images (Alpine)
  id: alpine
  version-id: "3.23"
  pretty-name: Docker Hardened Images/Alpine Linux v3.23
  home-url: https://docker.com/products/hardened-images/
  bug-report-url: https://docker.com/support/

work-dir: /srv

environment:
  SERVER_NAME: :8080
  SERVER_ROOT: /srv/public
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

paths:
  - type: file
    path: /etc/frankenphp/Caddyfile
    content: |
      {
      	skip_install_trust
      }
      {$SERVER_NAME} {
      	root {$SERVER_ROOT}
      	encode zstd br gzip
      	php_server
      }
  - type: directory
    path: /srv/public
  - type: symlink
    path: /srv/public/index.php
    source: /usr/share/frankenphp/index.php

annotations:
  org.opencontainers.image.description: A minimal FrankenPHP image
  org.opencontainers.image.licenses: MIT

entrypoint:
  - /usr/bin/frankenphp

cmd:
  - run
  - --config
  - /etc/frankenphp/Caddyfile

ports:
  - 8080/tcp
